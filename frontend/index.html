
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#9f1d2d">
    <meta name="description" content="Acesso ao Sistema Hospitalar Sentinela.">

    <link rel="icon" type="image/png" href="/assets/sentinela-icon.png">

    <title>Login | Hospital Sentinela</title>

    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <button
        id="themeToggle"
        class="theme-toggle"
        onclick="alternarTema()"
        type="button"
        aria-label="Alternar tema">
        🌙
    </button>

    <main class="pagina-login">

        <section class="container">

            <div class="logo-hospital">
                <img
                    src="/assets/sentinela-icon.png"
                    alt="Logo do Hospital Sentinela"
                    onerror="this.style.display='none'">
            </div>

            <div class="login-cabecalho">

                <span class="identificacao">HOSPITAL SENTINELA</span>

                <h1>Bem-vindo!</h1>

                <p>
                    Acesse o sistema hospitalar utilizando
                    seu usuário e senha.
                </p>

            </div>

            <form id="formLogin" onsubmit="event.preventDefault(); login();">

                <div class="campo">

                    <label for="usuario">Usuário</label>

                    <input
                        id="usuario"
                        name="usuario"
                        type="text"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required>

                </div>

                <div class="campo">

                    <label for="senha">Senha</label>

                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required>

                </div>

                <div
                    id="mensagem-erro"
                    role="alert"
                    aria-live="polite">
                </div>

                <button class="btn-login" type="submit">
                    Entrar no sistema
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <footer class="login-rodape">
                <span>Hospital Sentinela</span>
                <span>•</span>
                <span>Sistema de Gestão Hospitalar</span>
            </footer>

        </section>

        <div class="assinatura">
            SISTEMA HOSPITALAR
        </div>

    </main>

    <script>
        async function login() {

            const usuarioInput = document.getElementById("usuario").value.trim();
            const senhaInput = document.getElementById("senha").value.trim();
            const msgErro = document.getElementById("mensagem-erro");
            const botao = document.querySelector(".btn-login");

            msgErro.textContent = "";
            msgErro.style.display = "none";

            if (!usuarioInput || !senhaInput) {
                msgErro.textContent = "Preencha usuário e senha.";
                msgErro.style.display = "block";
                return;
            }

            botao.disabled = true;
            botao.textContent = "Entrando...";

            try {

                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario: usuarioInput,
                        senha: senhaInput
                    })
                });

                let data;

                try {
                    data = await response.json();
                } catch {
                    throw new Error("Não foi possível interpretar a resposta do servidor.");
                }

                if (!response.ok) {
                    throw new Error(
                        data.erro || "Usuário ou senha incorretos."
                    );
                }

                localStorage.setItem(
                    "sentinelaUser",
                    JSON.stringify(data)
                );

                if (data.tipo === "admin") {
                    location.href = "admin.html";

                } else if (data.tipo === "farmacia") {
                    location.href = "farmacia.html";

                } else if (data.tipo === "triagem") {
                    location.href = "triagem.html";

                } else if (data.tipo === "medico") {
                    location.href = "medico.html";

                } else {
                    location.href = "atendimento.html";
                }

            } catch (err) {

                msgErro.textContent = err.message;
                msgErro.style.display = "block";

                botao.disabled = false;
                botao.innerHTML = 'Entrar no sistema <span aria-hidden="true">→</span>';

            }

        }
    </script>

    <script src="/js/theme.js"></script>

</body>
</html>
