<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Medicações prescritas | Hospital Sentinela</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/mendicacoes.css">

<link rel="stylesheet" href="/css/hospital-premium.css">
</head>

<body>

<div class="container">
  <p style="color:#777;margin-bottom:18px">Acompanhe os registros de medicação vinculados aos atendimentos.</p>

  <h2>💊 Medicações Prescritas</h2>

  <!-- IMPLEMENTADO: local onde a lista de medicações será exibida -->
  <div id="listaMedicacoes"></div>

</div>

<script>
async function carregarMedicacoesPrescritas() {
  const div = document.getElementById("listaMedicacoes");
  try {
    const resposta = await fetch("/medicacoes");
    if (!resposta.ok) throw new Error("Não foi possível carregar os registros.");
    const data = await resposta.json();
    div.replaceChildren();
    if (!data.length) {
      const vazio = document.createElement("p");
      vazio.textContent = "Nenhuma medicação prescrita.";
      div.appendChild(vazio);
      return;
    }
    data.forEach(c => {
      const card = document.createElement("article"); card.className = "card";
      const title = document.createElement("h3"); title.textContent = c.paciente || "Paciente";
      const medication = document.createElement("p"); medication.textContent = `Medicação: ${c.medicacao || "—"}`;
      const diagnosis = document.createElement("p"); diagnosis.textContent = `Diagnóstico: ${c.diagnostico || "—"}`;
      const notes = document.createElement("p"); notes.textContent = `Observações: ${c.obs || "Nenhuma"}`;
      card.append(title, medication, diagnosis, notes); div.appendChild(card);
    });
  } catch (error) {
    div.textContent = error.message;
  }
}
carregarMedicacoesPrescritas();
</script>

<script src="/js/hospital-navigation.js"></script>
</body>
</html>
