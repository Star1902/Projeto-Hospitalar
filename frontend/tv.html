<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mídia Indoor - TV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{min-height:100vh;background:#171b22;display:grid;place-items:center;padding:2.5vh 2vw;overflow:hidden}
    .tv-container{display:grid;grid-template-columns:minmax(250px,.72fr) minmax(0,1.5fr);gap:2vh 1.5vw;width:96vw;height:95vh}
    .left-panel,.right-panel{display:flex;flex-direction:column;gap:2vh;min-width:0}
    .box{background:#fff;border:1px solid #e5e8ed;border-radius:22px;padding:2.2vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 14px 40px #0004;min-height:0}
    .local-box{flex:1.1;border-top:7px solid #8f1d35}.history-box{flex:1}
    .patient-box{flex:2.3;border-top:7px solid #8f1d35}.logo-box{flex:.65;background:#f5f6f8}
    .box-title{color:#687382;font-size:clamp(16px,1.6vw,26px);font-weight:800;letter-spacing:.12em;margin-bottom:15px}
    .local-number{color:#8f1d35;font-size:clamp(70px,9vw,150px);font-weight:800;line-height:1}
    .local-type{color:#596575;font-size:clamp(16px,1.8vw,28px);font-weight:700;margin-top:10px}
    .history-box{justify-content:flex-start;align-items:stretch}.history-box .box-title{text-align:center;font-size:clamp(14px,1.4vw,22px)}
    #history-list{list-style:none;width:100%;color:#354052;font-size:clamp(13px,1.25vw,20px);font-weight:700;text-align:left}
    #history-list li{padding:10px 4px;border-bottom:1px solid #e7e9ed}
    .patient-name{color:#8f1d35;font-size:clamp(38px,6.2vw,100px);font-weight:800;line-height:1.12;overflow-wrap:anywhere}
    .logo-text{color:#681326;font-size:clamp(20px,2.6vw,40px);font-weight:800}
    @keyframes flash{0%,100%{background:#fff}50%{background:#f8e9ed}}
    .flash{animation:flash .55s ease 3}
    @media(max-aspect-ratio:1/1){body{overflow:auto}.tv-container{height:auto;min-height:95vh;grid-template-columns:1fr}.left-panel,.right-panel{min-height:42vh}.box{padding:22px}.patient-box{min-height:35vh}}
  </style>
</head>
<body>

<!-- Estrutura da tela da TV criada para exibir o local e o nome do paciente chamado -->
<div class="tv-container">
  <div class="left-panel">
    <div class="box local-box">
      <div class="box-title" id="local-tipo">GUICHÊ</div>
      <div class="local-number" id="local-numero">--</div>
    </div>
    <div class="box history-box">
      <div class="box-title">ÚLTIMAS CHAMADAS</div>
      <ul id="history-list"></ul>
    </div>
  </div>
  <div class="right-panel">
    <div class="box patient-box">
      <div class="box-title">PACIENTE</div>
      <div class="patient-name" id="patient-name">AGUARDANDO...</div>
    </div>
    <div class="box logo-box">
      <div class="logo-text">🏥 Sistema Hospitalar</div>
    </div>
  </div>
</div>

<script>
let ultimoId = null;

// Função criada para buscar a chamada atual e o histórico da TV em tempo real.
function atualizar() {
  fetch("/tv/chamada")
    .then(r => r.json())
    .then(data => {
      const chamada = data.chamada;
      const historico = data.historico || [];

      if (chamada) {
        document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ";
        document.getElementById("local-numero").innerText = chamada.localNumero || "--";
        document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";

        // Flash visual quando há chamada nova
        if (chamada.id !== ultimoId) {
          ultimoId = chamada.id;
          const patientBox = document.querySelector(".patient-box");
          patientBox.classList.remove("flash");
          void patientBox.offsetWidth; // reflow
          patientBox.classList.add("flash");
        }
      }

      // Histórico
      const list = document.getElementById("history-list");
      list.innerHTML = "";
      historico.slice(0, 4).forEach(h => {
        const li = document.createElement("li");
        const tipo = h.localTipo ? h.localTipo.substring(0,4) : "GUIC";
        li.innerText = `${tipo}. ${h.localNumero} - ${h.paciente}`;
        list.appendChild(li);
      });
    })
    .catch(err => console.log("Erro ao buscar chamada:", err));
}

// Polling a cada 2 segundos
atualizar();
setInterval(atualizar, 2000);
</script>

</body>
</html>
